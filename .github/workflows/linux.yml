name: Build RAMD Docs development package
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libgtk-3-dev libjson-glib-dev libreofficekit-dev liblibreofficekitgtk libreoffice-writer libreoffice-gtk3 xvfb xauth fonts-liberation poppler-utils desktop-file-utils
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
          desktop-file-validate packaging/ramd-docs.desktop
      - name: Document engine roundtrip
        run: |
          SAL_USE_VCLPLUGIN=svp build/engine-check /usr/lib/libreoffice/program "file:///tmp/ramd-docs-engine-profile" "$PWD/build/roundtrip"
          python3 tests/check_outputs.py build/roundtrip
          pdftotext build/roundtrip/roundtrip.pdf build/roundtrip/pdf-text.txt
          grep -q RAMD_ROUNDTRIP_2026 build/roundtrip/pdf-text.txt
      - name: Editor integration
        run: |
          xvfb-run -a timeout 60s build/ui-check "$PWD/build/editor-check"
          python3 tests/check_ui_outputs.py build/editor-check
          pdftotext build/editor-check/edited.pdf build/editor-check/pdf-text.txt
          grep -q RAMD_EDITOR_TYPED build/editor-check/pdf-text.txt
      - name: Desktop launch
        run: |
          set +e
          xvfb-run -a timeout 12s build/ramd-docs > build/launch.log 2>&1
          code=$?
          set -e
          cat build/launch.log
          test "$code" -eq 124
      - name: Development DEB
        working-directory: build
        run: cpack -G DEB -D CPACK_PACKAGE_FILE_NAME=ramd-docs-0.2.0-dev-mint22-amd64
      - name: Install package in clean Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/build:/packages:ro" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y /packages/ramd-docs-0.2.0-dev-mint22-amd64.deb xvfb xauth
            test -f /usr/share/applications/ramd-docs.desktop
            ldd /usr/bin/ramd-docs > /tmp/dependencies.txt
            if grep -q "not found" /tmp/dependencies.txt; then cat /tmp/dependencies.txt; exit 1; fi
            useradd -m tester
            set +e
            runuser -u tester -- xvfb-run -a timeout 12s /usr/bin/ramd-docs > /tmp/launch.log 2>&1
            code=$?
            set -e
            cat /tmp/launch.log
            test "$code" -eq 124
          '
      - uses: actions/upload-artifact@v4
        with:
          name: RAMD-Docs-development-Mint22
          path: build/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAMD-Docs-validation
          path: |
            build/roundtrip/*
            build/launch.log
            build/editor-check/*
